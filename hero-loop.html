<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09070f" />
    <meta name="robots" content="noindex" />
    <title>Hero · World loop · 67js</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      const mobile = matchMedia("(max-width: 700px)").matches ? "-mobile" : "";
      const preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "image";
      preload.fetchPriority = "high";
      preload.href = `/hero-lab/poster-b-port${mobile}.webp`;
      document.head.append(preload);
    </script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="lab-nav">
      <a class="lab-brand" href="/hero-lab.html" aria-label="67js home"><img src="/logo.svg" alt="" width="30" height="30" />67js</a>
      <a href="/docs.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4V4Zm9 3a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/></svg>Docs</a>
      <a href="/showcase.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8v9l9 5 9-5V8l-9-5ZM3 8l9 5 9-5M12 13v9"/></svg>Showcase</a>
      <a href="/changelog.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3.5 2"/></svg>Changelog</a>
      <a href="https://github.com/codepawl/67.js" aria-label="GitHub"><span class="logo-mask logo-github" aria-hidden="true"></span>GitHub</a>
    </header>
    <main id="content" class="hero-loop" data-scene="port">
      <div class="stage" id="stage" role="img" aria-label="A live 3D scene: Container port">
        <picture><source media="(max-width: 700px)" id="poster-mobile" /><img class="poster" id="poster" alt="" width="1440" height="900" fetchpriority="high" /></picture>
        <script>document.querySelector("#poster-mobile").srcset = `/hero-lab/poster-b-port-mobile.webp`; document.querySelector("#poster").src = `/hero-lab/poster-b-port.webp`;</script>
      </div>
      <div class="copy">
        <h1 class="rise" style="--i:0">A 3D engine<br />agents can drive</h1>
        <p class="lede rise" style="--i:1">WebGL2 rendering, deterministic animation and an MCP server in one package.</p>
        <div class="lab-actions rise" style="--i:2">
          <a class="lab-button is-primary" href="/docs.html#getting-started"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4V4Zm9 3a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/></svg>Get started<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
          <a class="lab-button" href="https://www.npmjs.com/package/@codepawlhq/67js"><span class="logo-mask logo-npm" aria-hidden="true"></span>npm</a>
        </div>
      </div>
      <div class="scene-bar">
        <a class="attribution" id="attribution" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span></span></a>
        <div class="credits-panel" id="credits-panel" hidden></div>
        <nav class="scene-tabs" id="scene-tabs" aria-label="Scenes"></nav>
        <button class="credits-toggle" id="credits-toggle" type="button" aria-expanded="false" aria-controls="credits-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></svg>Credits</button>
      </div>
    </main>
    <script type="module" src="/src/hero-lab/hero-loop.js"></script>
  </body>
</html>
