name: Feature request
description: Something 67js or its MCP tools should be able to do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/codepawl/67.js/blob/main/ROADMAP.md) and the [open issues](https://github.com/codepawl/67.js/issues) first.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to make, and where 67js stops you today. A picture of the result you want helps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the change would cover, such as a new option, a new MCP tool field or a new addon. Say what it should not cover.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we will know it works. Write one checkbox line for each result, starting with "- [ ]". Contributors copy this list into their pull request.
      placeholder: |
        - [ ] An agent can ... in one tool call
        - [ ] A test covers ...
    validations:
      required: true
  - type: dropdown
    id: goal
    attributes:
      label: Goal (optional)
      description: Which part of the goal this serves. Choose "Not sure" and the maintainer sets it.
      options:
        - Not sure
        - capable (do more, like Blender)
        - light (stay small and fast, like three.js)
        - ai (make agents succeed in fewer calls)
  - type: dropdown
    id: priority
    attributes:
      label: Priority (optional)
      description: How soon you need it. The maintainer sets the final priority.
      options:
        - Not sure
        - must (blocks something)
        - should (clearly useful)
        - could (nice to have)
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open the pull request for this myself.
