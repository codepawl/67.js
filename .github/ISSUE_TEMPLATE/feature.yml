name: Feature request
description: Something 67js or its MCP tools should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/codepawl/67.js/blob/main/ROADMAP.md) and the [open issues](https://github.com/codepawl/67.js/issues) first.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to make, and where 67js stops you today. A picture of the result you want helps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the change would cover, such as a new option, a new MCP tool field or a new addon. Say what it should not cover.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we will know it works, as a checklist.
      placeholder: |
        - [ ] An agent can ... in one tool call
        - [ ] A test covers ...
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open the pull request for this myself.
