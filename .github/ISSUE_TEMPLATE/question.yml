name: Question
description: How do I do something with 67js or its MCP server?
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [guide](https://67js.codepawl.com/guide.md), the [MCP reference](https://github.com/codepawl/67.js/blob/main/docs/mcp.md) and [llms.txt](https://67js.codepawl.com/llms.txt) answer most questions. An agent can read them too.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to do and what you tried. Include code or the tool call when you have one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 67js version
      placeholder: 0.16.0
