name: Publish Crucible

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # The same checks a pull request runs, from test.yml.
  checks:
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Publish a new version through OIDC
        run: npm run publish:ci
      - name: Check that the registry serves the version in package.json
        run: |
          expected=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          for attempt in $(seq 1 30); do
            published=$(npm view "${name}" version 2>/dev/null || true)
            if [ "${published}" = "${expected}" ]; then
              echo "${name}@${published} is live."
              exit 0
            fi
            echo "Registry shows '${published}', waiting for ${expected} (attempt ${attempt} of 30)."
            sleep 10
          done
          echo "The registry did not serve ${name}@${expected} within five minutes." >&2
          exit 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the tag and release page if they are missing
        run: node scripts/release-publish-notes.mjs
        env:
          GH_TOKEN: ${{ github.token }}
