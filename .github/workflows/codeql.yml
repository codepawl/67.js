name: CodeQL

# No push trigger: every change to main arrives through a pull request that CodeQL already scanned.
# The weekly run refreshes the alert list of main.
# CodeQL reads only the JavaScript and TypeScript sources, so a pull request that changes nothing but documents, change notes
# or media skips the scan. The scan is not a required check (only `test` is), so a skipped run blocks no merge.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'changes/**'
      - 'assets/**'
      - 'public/**'
      - 'licenses/**'
      - '**/*.webp'
      - '**/*.jpg'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.hdr'
      - '**/*.glb'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JavaScript is analysed from source, so no build step runs and no dependency scripts execute.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
