name: Test

# Every job runs at once. The last job, named `test`, is the one branch protection requires: it waits for the others and
# fails when any of them did not succeed. publish.yml calls this workflow, so a release runs the same checks as its pull request.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high

  # Size and tool cost compare against the pull request base, which only a merge commit has, so a release run skips them.
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      # The tested tree is the merge of the pull request into the base branch as it was when the merge was built. Its first parent
      # is the base of every size, tool cost and archive check, not the newest tip, which may hold work this tree lacks.
      - name: Find the base of the size checks
        id: base
        run: |
          sha=$(node scripts/ci-base-sha.mjs)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "SIZE_BASE_REF=${sha}" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/size-base
          key: size-base-${{ steps.base.outputs.sha }}-${{ hashFiles('scripts/measure-size.mjs', 'scripts/size-*.mjs', 'scripts/*tool-cost*.mjs', 'scripts/measure-archive.mjs', 'scripts/build-mcp.mjs', 'vite.lib.config.js', 'package-lock.json') }}
      - run: npm run size -- --base "$SIZE_BASE_REF"
      - run: npm run tool-cost -- --base "$SIZE_BASE_REF"

  # `node --test` already runs every file in its own process (Node 24 default, --test-isolation=process), so one pass over
  # the files is also the isolation check. Six shards of hashed file names (scripts/shard-test-files.mjs). The light bake tests are heavy, so one shard of three took twice as long as the others.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The live MCP tests need build/ and build/mcp.
      - run: npm run build:lib
      - run: mkdir -p coverage && npm run test:coverage -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/shard-${{ matrix.shard }}.info --test-reporter=./scripts/test-timing-reporter.mjs --test-reporter-destination=coverage/timings-${{ matrix.shard }}.json $(node scripts/shard-test-files.mjs ${{ matrix.shard }} 6)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov-shard-${{ matrix.shard }}
          path: |
            coverage/shard-${{ matrix.shard }}.info
            coverage/timings-${{ matrix.shard }}.json
          if-no-files-found: error

  coverage:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lcov-shard-*
          path: coverage/shards
          merge-multiple: true
      - run: node scripts/coverage-gate.mjs coverage/shards --merged-out coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run prepare:release
      - run: npm run check:links:package
      - run: npm run smoke:package
      - run: npm run smoke:mcp-package

  test:
    if: always()
    needs: [audit, size, unit, coverage, package]
    runs-on: ubuntu-latest
    steps:
      # A skipped size job is expected outside pull requests. Anything else that is not a success fails the check.
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            let failed = false;
            for (const [name, { result }] of Object.entries(needs)) {
              const expectedSkip = name === "size" && process.env.EVENT_NAME !== "pull_request";
              const ok = result === "success" || (result === "skipped" && expectedSkip);
              console.log(`${ok ? "ok  " : "FAIL"} ${name}: ${result}`);
              if (!ok) failed = true;
            }
            process.exit(failed ? 1 : 0);
          '
