name: PR metadata

# A friendly check of the pull request description, files and labels against CONTRIBUTING.md. It is not a required check.
# It runs on pull_request_target so that it can comment on pull requests from forks. For that reason it NEVER checks out,
# builds or runs the pull request's code: the checkout is the base branch (the default for this event), and the pull request
# is read through the API only. Keep it that way. The hourly schedule sends the 24 hour reminder and closes pull requests
# that stayed unfixed for 72 hours. How it works and how to test it: CONTRIBUTING.md#the-pull-request-check.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned, ready_for_review]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what the bot would do and change nothing
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_METADATA_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        with:
          script: |
            const { runPullRequestCheck } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-metadata-run.mjs`);
            await runPullRequestCheck({ github, context, core });
