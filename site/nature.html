<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17231f" />
    <meta name="description" content="Explore a living alpine valley, built entirely from geometry in Crucible." />
    <title>Crucible · Silverwater valley</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" /><link rel="icon" href="/favicon.ico?v=2" sizes="48x48" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <main>
      <header class="world-header">
        <a class="brand" href="./index.html" aria-label="Crucible home">Crucible</a>
        <nav aria-label="Scenes">
          <a href="./object.html">Object</a>
          <a href="./nature.html" aria-current="page">Nature</a>
          <a href="./film.html">Film</a>
        <a href="./motion.html">Motion</a>
        <a href="./docs.html">Docs</a><a href="./index.html#examples">Showcase</a></nav>
        <button id="save-image">Save PNG <span aria-hidden="true">↗</span></button>
      </header>
      <div class="landscape-title">
        <h1>Silverwater valley</h1>
        <p>A living valley built from shared geometry</p>
      </div>
      <canvas id="viewport" tabindex="0" aria-label="Silverwater valley. Drag or use arrow keys to orbit; scroll or use plus and minus to zoom. Click the water to make a ripple."></canvas>
      <section class="landscape-controls" aria-label="Landscape controls">
        <div class="demo-presets" role="group" aria-label="Light presets"><button data-daylight="1">Day</button><button data-daylight="0.5">Golden hour</button><button data-daylight="0.08">Dusk</button></div>
        <label class="view-control" for="viewpoint">View
          <select id="viewpoint"></select>
        </label>
        <label class="range-control" for="daylight"><span>Light <output id="daylight-value">Day</output></span>
          <input id="daylight" type="range" min="0" max="1" step="0.01" value="1" aria-label="Daylight, from dusk to day" />
        </label>
        <label class="range-control" for="wind"><span>Wind <output id="wind-value">Gentle</output></span>
          <input id="wind" type="range" min="0" max="1" step="0.01" value="0.35" />
        </label>
        <label for="detail">Detail
          <select id="detail"><option value="low">Low</option><option value="balanced" selected>Balanced</option><option value="high">High</option></select>
        </label>
        <button id="motion" aria-pressed="false">Pause motion</button>
      </section>
      <footer>
        <p class="hint">Drag to explore · Click the water</p>
        <div class="metrics" aria-label="Renderer statistics"><span id="geometry-stat"></span><span id="memory-stat"></span></div>
      </footer>
      <p id="notice" role="status" hidden></p>
    </main>
    <script type="module" src="/src/nature-viewer.js"></script>
  </body>
</html>
