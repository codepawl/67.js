<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Load a GLB asset into 67js, inspect its materials and scrub rigid node animation." />
    <title>Asset viewer · 67js</title>
  <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <main class="workspace">
      <header class="toolbar">
        <a class="brand" href="./index.html">67js</a>
        <h1>Asset viewer</h1>
        <nav aria-label="Camera view">
          <button data-view="perspective" aria-pressed="true">Perspective</button>
          <button data-view="front" aria-pressed="false">Front</button>
          <button data-view="right" aria-pressed="false">Right</button>
          <button data-view="top" aria-pressed="false">Top</button>
        </nav>
        <nav class="studio-nav" aria-label="Scenes"><a href="./object.html">Object</a><a href="./nature.html">Nature</a><a href="./film.html">Film</a><a href="./motion.html">Motion</a><a href="./docs.html">Docs</a><a href="./index.html#examples">Showcase</a></nav>
        <div class="toolbar-actions"><button id="fit">Fit</button><button id="open" class="primary">Open GLB</button></div>
        <input id="file" type="file" accept=".glb,model/gltf-binary" hidden />
      </header>
      <section class="asset-controls" aria-label="Materials and animation">
        <label>Exposure <input id="exposure" type="range" min="0.25" max="2" step="0.05" value="1" /></label>
        <label>Bloom <input id="bloom" type="range" min="0" max="1" step="0.05" value="0" /></label>
        <label>Animation <select id="clip" disabled><option>No animation</option></select></label>
        <button id="save">Save PNG</button>
      </section>
      <section class="stage" aria-label="3D asset"><canvas id="viewport" tabindex="0" aria-label="Asset view. Drag to orbit, scroll to zoom."></canvas><p id="notice" class="notice" role="status" hidden></p></section>
      <div class="timeline"><button id="play" disabled>▶ Play</button><label for="time">Timeline</label><input id="time" type="range" min="0" max="1" step="0.01" value="0" disabled /><output id="time-value">0.00 s</output><span class="metrics" id="metrics"></span></div>
      <p class="hint"><span>Drag to orbit · Scroll to zoom · Drop a GLB file</span><a href="./docs.html#import-and-export-models">API guide ↗</a></p>
    </main>
    <script type="module" src="/src/asset-viewer.js"></script>
  </body>
</html>
