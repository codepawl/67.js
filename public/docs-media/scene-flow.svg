<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, system-ui, sans-serif">
  <title>Parts go into the renderer one time. Each frame draws a picture from a camera.</title>
  <rect width="960" height="300" rx="24" fill="#101014"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8a8a93"/>
    </marker>
  </defs>
  <g>
    <rect x="40" y="56" width="250" height="188" rx="18" fill="#212121"/>
    <text x="66" y="96" fill="#ececec" font-size="22" font-weight="600">Parts</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#b4b4b4">
      <text x="66" y="134">name</text>
      <text x="66" y="162">geometry</text>
      <text x="66" y="190">matrix</text>
      <text x="66" y="218">material</text>
    </g>
    <path d="m212 128 26 -14 26 14v30l-26 14-26-14z" fill="#3e8f63"/>
    <path d="m212 128 26 14 26-14M238 142v30" fill="none" stroke="#2c6a49" stroke-width="2"/>
  </g>
  <path d="M302 150h80" stroke="#8a8a93" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="342" y="136" fill="#8a8a93" font-size="14" text-anchor="middle">one time</text>
  <g>
    <rect x="394" y="56" width="220" height="188" rx="18" fill="#212121"/>
    <text x="420" y="96" fill="#ececec" font-size="22" font-weight="600">CrucibleRenderer</text>
    <g font-size="15" fill="#b4b4b4">
      <text x="420" y="134">uploads geometry</text>
      <text x="420" y="162">and textures</text>
      <text x="420" y="198" font-family="ui-monospace, Consolas, monospace" fill="#a6c1ff">updateParts()</text>
      <text x="420" y="222">moves and recolors</text>
    </g>
  </g>
  <path d="M626 150h80" stroke="#8a8a93" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="666" y="136" fill="#8a8a93" font-size="14" text-anchor="middle">each frame</text>
  <g>
    <rect x="718" y="56" width="202" height="188" rx="18" fill="#212121"/>
    <text x="744" y="96" fill="#ececec" font-size="22" font-weight="600">Picture</text>
    <text x="744" y="134" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#a6c1ff">render({ eye,</text>
    <text x="744" y="158" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#a6c1ff">  target })</text>
    <rect x="744" y="176" width="150" height="48" rx="8" fill="#2f2f2f"/>
    <circle cx="772" cy="200" r="12" fill="#e0a548"/>
    <rect x="800" y="190" width="22" height="22" rx="4" fill="#3e8f63"/>
    <circle cx="858" cy="200" r="13" fill="none" stroke="#bf3b4f" stroke-width="5"/>
  </g>
</svg>
