[package]
name = "render-native"
version = "0.1.0"
edition = "2021"
description = "Hardware ray traced stills for 67js: the WGSL path tracer with ray queries on wgpu and Vulkan."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
